schema_version: 1

context:
  version: "1.28.0"

package:
  name: sagemaker-train
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sagemaker-train/sagemaker_train-${{ version }}.tar.gz
  sha256: 6fc94d6e23faead3b848d10391725049acda928c7008624a397267afcbcb08be

build:
  number: 0
  noarch: python
  script: |
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    rm -f $SP_DIR/sagemaker/__init__.py
    rm -rf $SP_DIR/sagemaker/__pycache__

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - sagemaker-core >=2.24.0
    - sagemaker-mlflow >=0.0.1,<1.0.0
    - graphene >=3,<4
    - typing_extensions >=4.9.0
    - tblib >=1.7.0
    - pyyaml >=6.0,<7.0
    - paramiko >=2.11.0
    - jinja2 >=3.0,<4.0
    - mlflow >=3.0.0,<4.0.0
    - nest-asyncio >=1.5.0
  # databricks-sdk (pulled transitively via mlflow) forbids protobuf 5.26-5.28.* and
  # 5.29.0-4; without this the solver backtracks to protobuf 5.28.3 (because the
  # libprotobuf global pin is >=7, which databricks-sdk also forbids) and `pip check`
  # fails. Constrain protobuf to the databricks-sdk-compatible window. protobuf is not
  # a direct dependency, so this is a run_constraints (soft) entry, not a run dep.
  run_constraints:
    - protobuf >=5.29.5,<7

tests:
  - python:
      imports:
        - sagemaker.train
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: SageMaker Train package for training and deploying models
  homepage: https://github.com/aws/sagemaker-python-sdk
  license: Apache-2.0
  license_file: LICENSE
  documentation: https://sagemaker.readthedocs.io/en/stable/
  repository: https://github.com/aws/sagemaker-python-sdk

extra:
  recipe-maintainers:
    - mollyheamazon
    - mufaddal-rohawala
    - nargokul
    - aviruthen
